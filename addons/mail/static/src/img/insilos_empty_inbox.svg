<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
    <defs>
        <linearGradient id="insilos_inbox_tray_grad" x1="50" y1="52" x2="50" y2="88" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1E293B" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#1E293B" stop-opacity="0.28"/>
        </linearGradient>
        <linearGradient id="insilos_badge_glow" x1="50" y1="20" x2="50" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FF8000" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#EA580C" stop-opacity="0.08"/>
        </linearGradient>
    </defs>

    <!-- Ambient Glow behind Central Orb -->
    <circle cx="50" cy="34" r="22" fill="url(#insilos_badge_glow)"/>

    <!-- Sparkle Stars (Phosphor Style 4-point stars) -->
    <path d="M22 22 C22 26 20 28 16 28 C20 28 22 30 22 34 C22 30 24 28 28 28 C24 28 22 26 22 22 Z" fill="#FF8000"/>
    <path d="M78 16 C78 19 76.5 20.5 73.5 20.5 C76.5 20.5 78 22 78 25 C78 22 79.5 20.5 82.5 20.5 C79.5 20.5 78 19 78 16 Z" fill="#FF8000"/>
    <circle cx="27" cy="46" r="1.5" fill="#FF8000" opacity="0.7"/>
    <circle cx="75" cy="44" r="1.5" fill="#FF8000" opacity="0.7"/>

    <!-- Central Floating Checkmark Badge (Phosphor Duotone Standard) -->
    <g>
        <!-- Badge Duotone Fill -->
        <circle cx="50" cy="34" r="14" fill="#FF8000" fill-opacity="0.18"/>
        <!-- Badge Stroke -->
        <circle cx="50" cy="34" r="14" stroke="#FF8000" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Phosphor Checkmark -->
        <path d="M43 34.5 L48 39.5 L57.5 29.5" stroke="#FF8000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Inbox Tray Base Geometry (Phosphor Duotone Style) -->
    <!-- Tray Duotone Interior Shading -->
    <path d="M16 60 L24 78 C24.5 79.5 26 80.5 27.5 80.5 L38 80.5 C39 80.5 40 81.5 40.5 82.5 L42.5 86 C43 87 44 87.5 45.5 87.5 L54.5 87.5 C56 87.5 57 87 57.5 86 L59.5 82.5 C60 81.5 61 80.5 62 80.5 L72.5 80.5 C74 80.5 75.5 79.5 76 78 L84 60 C84.5 58.5 83.5 57 82 57 L68 57 L64 65 C63.5 66 62.5 67 61 67 L39 67 C37.5 67 36.5 66 36 65 L32 57 L18 57 C16.5 57 15.5 58.5 16 60 Z" fill="url(#insilos_inbox_tray_grad)"/>

    <!-- Back Tray Rim -->
    <path d="M22 57 L78 57" stroke="#1E293B" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.6"/>

    <!-- Main Front Tray Outline & Cutout -->
    <path d="M16 57 L25.5 78.5 C26.2 80 27.7 81 29.5 81 L38 81 C39.5 81 41 82 41.8 83.2 L43.5 86 C44.5 87.5 46.2 88.5 48 88.5 L52 88.5 C53.8 88.5 55.5 87.5 56.5 86 L58.2 83.2 C59 82 60.5 81 62 81 L70.5 81 C72.3 81 73.8 80 74.5 78.5 L84 57" stroke="#070B14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Ground Reflection Line -->
