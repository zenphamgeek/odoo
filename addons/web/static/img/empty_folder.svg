<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80" fill="none">
  <defs>
    <!-- Brand Gradients (IBM Carbon 11 / SAP Fiori Horizon) -->
    <linearGradient id="efBrandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2E64" />
      <stop offset="50%" stop-color="#0F62FE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="efFolderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B224A" />
      <stop offset="100%" stop-color="#06152F" />
    </linearGradient>

    <linearGradient id="efFolderFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2E64" />
      <stop offset="70%" stop-color="#103E7E" />
      <stop offset="100%" stop-color="#0B2E64" />
    </linearGradient>

    <linearGradient id="efTopBevel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0F62FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="efAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0B2E64" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0B2E64" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="efGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B2E64" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0B2E64" stop-opacity="0" />
    </radialGradient>

    <filter id="efFolderShadow" x="8" y="24" width="104" height="52" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#0B2E64" flood-opacity="0.32" />
    </filter>

    <style>
      :root {
        --ef-doc-front-bg: #FFFFFF;
        --ef-doc-front-border: #DDE5ED;
        --ef-doc-back-bg: #E2E8F0;
        --ef-skel-primary: #D4DFEB;
        --ef-skel-secondary: #EDF2F7;
        --ef-notch: #1A4785;
      }
      .ef-doc-front { fill: var(--ef-doc-front-bg); stroke: var(--ef-doc-front-border); stroke-width: 1; }
      .ef-doc-back { fill: var(--ef-doc-back-bg); }
      .ef-skel-bold { fill: var(--ef-skel-primary); }
      .ef-skel-light { fill: var(--ef-skel-secondary); }
      .ef-notch { fill: var(--ef-notch); }
      .ef-bg-glow { opacity: 0.8; }

      @media (prefers-color-scheme: dark) {
        :root {
          --ef-doc-front-bg: #1A2230;
          --ef-doc-front-border: #2D3A4F;
          --ef-doc-back-bg: #232D3F;
          --ef-skel-primary: #34445C;
          --ef-skel-secondary: #1E2636;
          --ef-notch: #0F62FE;
        }
        .ef-bg-glow { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Ambient Center Glow -->
  <ellipse cx="60" cy="40" rx="46" ry="26" fill="url(#efAmbientGlow)" class="ef-bg-glow" />

  <!-- Ground Plane Contact Shadow -->
  <ellipse cx="60" cy="71" rx="42" ry="4.5" fill="url(#efGroundShadow)" />

  <!-- Floating Micro-Particle Accents -->
  <circle cx="106" cy="18" r="1.5" fill="#00F2FE" opacity="0.65" />
  <circle cx="14" cy="24" r="1.2" fill="#00F2FE" opacity="0.45" />

  <!-- Back Folder Plate with Architectural Index Tab -->
  <path d="M 21 18 H 44 C 47 18 50 22 53 25 H 99 A 5 5 0 0 1 104 30 V 62 A 5 5 0 0 1 99 67 H 21 A 5 5 0 0 1 16 62 V 23 A 5 5 0 0 1 21 18 Z" fill="url(#efFolderBack)" />

  <!-- Layered Document Tabs (Protruding Interior Sheets) -->
  <!-- Layer 2: Back Document Sheet -->
  <rect x="42" y="14" width="46" height="30" rx="3" class="ef-doc-back" />
  <rect x="48" y="18" width="18" height="2" rx="1" fill="#CBD5E1" opacity="0.6" />

  <!-- Layer 1: Front Ceramic Document Sheet -->
  <g>
    <rect x="28" y="17" width="56" height="32" rx="3.5" class="ef-doc-front" />
    <rect x="34" y="23" width="16" height="3" rx="1.5" fill="url(#efBrandGrad)" />
    <rect x="34" y="29" width="38" height="2.5" rx="1.25" class="ef-skel-bold" />
    <rect x="34" y="34" width="28" height="2.5" rx="1.25" class="ef-skel-light" />
  </g>

  <!-- Front Folder Body with Architectural Bevel Lip -->
  <g filter="url(#efFolderShadow)">
    <!-- Pocket Base Path -->
    <path d="M 15 36 C 15 34 17 33 19 33.5 L 53 38.5 C 57 39 61 39 65 38.5 L 99 33.5 C 101 33 103 34 103 36 V 62 A 5 5 0 0 1 98 67 H 20 A 5 5 0 0 1 15 62 Z" fill="url(#efFolderFront)" stroke="#123B75" stroke-width="0.8" />
    
    <!-- Horizon Tech Highlight Lip Stroke -->
    <path d="M 15 36 L 53 38.5 C 57 39 61 39 65 38.5 L 103 36" stroke="url(#efTopBevel)" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Geometric Diamond Emblem & Balance Indices -->
  <path d="M 59 49 L 63 53 L 59 57 L 55 53 Z" fill="url(#efBrandGrad)" />
  <circle cx="59" cy="53" r="1.3" fill="#FFFFFF" />

  <rect x="42" y="52.25" width="8" height="1.5" rx="0.75" class="ef-notch" />
  <rect x="68" y="52.25" width="8" height="1.5" rx="0.75" class="ef-notch" />
</svg>