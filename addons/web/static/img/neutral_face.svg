<svg xmlns="http://www.w3.org/2000/svg" width="120" height="140" viewBox="0 0 120 140" fill="none">
  <defs>
    <!-- Brand Gradients (Insilos Orange Line Art / Horizon-Carbon) -->
    <linearGradient id="nfBrandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="55%" stop-color="#FF8000" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>

    <linearGradient id="nfLensGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA500" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="nfLensRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA500" />
      <stop offset="50%" stop-color="#FF8000" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <radialGradient id="nfAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA500" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#FF8000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FF8000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nfGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nfLensAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA500" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#FF8000" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </radialGradient>

    <filter id="nfCardShadow" x="14" y="16" width="94" height="108" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <filter id="nfLensShadow" x="42" y="48" width="64" height="66" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#FF6B00" flood-opacity="0.28" />
    </filter>

    <style>
      :root {
        --nf-card-bg: #FFFFFF;
        --nf-card-border: #DDE5ED;
        --nf-skel-dashed: #CBD5E1;
        --nf-skel-dim: #EDF2F7;
        --nf-fold-bg: #E2E8F0;
        --nf-fold-border: #CBD5E1;
        --nf-filter-chip: #EDF2F7;
        --nf-accent-dot: #FF8000;
      }
      .nf-card { fill: var(--nf-card-bg); stroke: var(--nf-card-border); stroke-width: 1.2; }
      .nf-fold { fill: var(--sf-fold-bg); stroke: var(--sf-fold-border); stroke-width: 1; }
      .nf-skel-dashed { stroke: var(--nf-skel-dashed); stroke-width: 1.2; fill: none; stroke-dasharray: 3 2.5; }
      .nf-skel-dim { fill: var(--nf-skel-dim); }
      .nf-filter-chip { fill: var(--nf-filter-chip); }
      .nf-accent-dot { fill: var(--nf-accent-dot); opacity: 0.35; }
      .nf-aura { opacity: 0.7; }
      .nf-bg-glow { opacity: 0.8; }

      @media (prefers-color-scheme: dark) {
        :root {
          --nf-card-bg: #1A2230;
          --nf-card-border: #2D3A4F;
          --nf-skel-dashed: #34445C;
          --nf-skel-dim: #232D3F;
          --nf-fold-bg: #273347;
          --nf-fold-border: #3A4C68;
          --nf-filter-chip: #232D3F;
          --nf-accent-dot: #FF8000;
        }
        .nf-aura { opacity: 0.95; }
        .nf-bg-glow { opacity: 1; }
        .nf-accent-dot { opacity: 0.65; }
      }
    </style>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <ellipse cx="60" cy="65" rx="48" ry="52" fill="url(#nfAmbientGlow)" class="nf-bg-glow" />

  <!-- Ground Plane Contact Shadow -->
  <ellipse cx="60" cy="123" rx="38" ry="5" fill="url(#nfGroundShadow)" />

  <!-- Geometric Coordinate Decors -->
  <circle cx="20" cy="46" r="1.5" fill="#FFA500" opacity="0.6" />
  <circle cx="102" cy="34" r="1.2" class="nf-accent-dot" />
  <path d="M 22 84 L 23.5 87 L 26.5 88.5 L 23.5 90 L 22 93 L 20.5 90 L 17.5 88.5 L 20.5 87 Z" fill="#FFA500" opacity="0.5" />

  <!-- Architectural Card Silhouette (Cohesive with smiling_face) -->
  <g filter="url(#nfCardShadow)">
    <path d="M 30 22 H 74 L 94 42 V 104 A 6 6 0 0 1 88 110 H 30 A 6 6 0 0 1 24 104 V 28 A 6 6 0 0 1 30 22 Z" class="nf-card" />
  </g>

  <!-- Folded Corner Flap -->
  <path d="M 74 22 V 36 A 6 6 0 0 0 80 42 H 94 Z" class="nf-fold" />
  <path d="M 74 42 L 74 36 L 80 42 Z" fill="#0B2E64" opacity="0.12" />

  <!-- Filter Query Indicators on Card -->
  <rect x="34" y="34" width="20" height="6" rx="3" fill="url(#nfBrandGrad)" />
  <rect x="58" y="34" width="16" height="6" rx="3" class="nf-filter-chip" />

  <!-- Unmatched / Dashed Skeleton Rows -->
  <rect x="34" y="48" width="46" height="4.5" rx="2.25" class="nf-skel-dashed" />
  <rect x="34" y="58" width="38" height="4" rx="2" class="nf-skel-dashed" />
  <rect x="34" y="68" width="42" height="4" rx="2" class="nf-skel-dashed" />
  <rect x="34" y="78" width="28" height="4" rx="2" class="nf-skel-dashed" />

  <!-- Radar Scan Horizon Arc -->
  <circle cx="64" cy="74" r="30" stroke="url(#nfLensRim)" stroke-width="0.8" stroke-dasharray="2 3" fill="none" opacity="0.3" />

  <!-- Architectural Inspection Lens & Filter Mechanism -->
  <g filter="url(#nfLensShadow)">
    <!-- Lens Glow Aura -->
    <circle cx="64" cy="74" r="22" fill="url(#nfLensAura)" class="nf-aura" />

    <!-- Solid Ergonomic Handle -->
    <rect x="76" y="85" width="6.5" height="19" rx="3.25" transform="rotate(-45 76 85)" fill="url(#nfBrandGrad)" />
    <!-- Metallic Collar -->
    <rect x="74" y="83" width="7" height="3" rx="1" transform="rotate(-45 74 83)" fill="#FFA500" opacity="0.8" />

    <!-- Glass Rim & Body -->
    <circle cx="64" cy="74" r="18" fill="url(#nfLensGlass)" stroke="url(#nfLensRim)" stroke-width="2.2" />

    <!-- High-Clarity Glass Reflection Arc -->
    <path d="M 52 65 A 14 14 0 0 1 73 62" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.55" />

    <!-- Precision Filter / Reticle Indicator inside Glass -->
    <circle cx="64" cy="74" r="7" stroke="#FF8000" stroke-width="1.2" stroke-dasharray="2 1.5" fill="none" opacity="0.85" />
    <path d="M 55 74 H 73" stroke="#FF8000" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 64 65 V 68 M 64 80 V 83" stroke="#FF8000" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="64" cy="74" r="1.6" fill="#FF8000" />
  </g>
</svg>