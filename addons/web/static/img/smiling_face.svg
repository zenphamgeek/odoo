<svg xmlns="http://www.w3.org/2000/svg" width="120" height="140" viewBox="0 0 120 140" fill="none">
  <defs>
    <!-- Brand Gradients (Insilos Orange Line Art / Horizon-Carbon) -->
    <linearGradient id="sfBrandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="55%" stop-color="#FF8000" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>

    <linearGradient id="sfFoldGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <radialGradient id="sfAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA500" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#FF8000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FF8000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sfGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sfEmblemAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA500" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#FF8000" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </radialGradient>

    <filter id="sfCardShadow" x="14" y="16" width="94" height="108" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <filter id="sfEmblemShadow" x="60" y="78" width="44" height="44" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#FF6B00" flood-opacity="0.30" />
    </filter>

    <style>
      :root {
        --sf-card-bg: #FFFFFF;
        --sf-card-border: #DDE5ED;
        --sf-skel-primary: #D4DFEB;
        --sf-skel-secondary: #EDF2F7;
        --sf-skel-tertiary: #F4F7FA;
        --sf-fold-bg: #E2E8F0;
        --sf-fold-border: #CBD5E1;
        --sf-accent-dot: #FF8000;
      }
      .sf-card { fill: var(--sf-card-bg); stroke: var(--sf-card-border); stroke-width: 1.2; }
      .sf-fold { fill: var(--sf-fold-bg); stroke: var(--sf-fold-border); stroke-width: 1; }
      .sf-skel-bold { fill: var(--sf-skel-primary); }
      .sf-skel-light { fill: var(--sf-skel-secondary); }
      .sf-skel-dim { fill: var(--sf-skel-tertiary); }
      .sf-accent-dot { fill: var(--sf-accent-dot); opacity: 0.35; }
      .sf-aura { opacity: 0.7; }
      .sf-bg-glow { opacity: 0.8; }

      @media (prefers-color-scheme: dark) {
        :root {
          --sf-card-bg: #1A2230;
          --sf-card-border: #2D3A4F;
          --sf-skel-primary: #34445C;
          --sf-skel-secondary: #232D3F;
          --sf-skel-tertiary: #1E2636;
          --sf-fold-bg: #273347;
          --sf-fold-border: #3A4C68;
          --sf-accent-dot: #FF8000;
        }
        .sf-aura { opacity: 0.95; }
        .sf-bg-glow { opacity: 1; }
        .sf-accent-dot { opacity: 0.65; }
      }
    </style>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <ellipse cx="60" cy="65" rx="48" ry="52" fill="url(#sfAmbientGlow)" class="sf-bg-glow" />

  <!-- Ground Plane Contact Shadow -->
  <ellipse cx="60" cy="123" rx="38" ry="5" fill="url(#sfGroundShadow)" />

  <!-- Micro Architecture Grid Elements -->
  <circle cx="20" cy="38" r="1.5" fill="#FFA500" opacity="0.6" />
  <circle cx="102" cy="28" r="1.2" class="sf-accent-dot" />
  <path d="M 98 42 L 99.5 45 L 102.5 46.5 L 99.5 48 L 98 51 L 96.5 48 L 93.5 46.5 L 96.5 45 Z" fill="#FF8000" opacity="0.55" />

  <!-- Ceramic Document Card with Chamfer Fold (Filtered Shadow) -->
  <g filter="url(#sfCardShadow)">
    <path d="M 30 22 H 74 L 94 42 V 104 A 6 6 0 0 1 88 110 H 30 A 6 6 0 0 1 24 104 V 28 A 6 6 0 0 1 30 22 Z" class="sf-card" />
  </g>

  <!-- Folded Corner Flap -->
  <path d="M 74 22 V 36 A 6 6 0 0 0 80 42 H 94 Z" class="sf-fold" />
  <path d="M 74 42 L 74 36 L 80 42 Z" fill="#0B2E64" opacity="0.12" />

  <!-- Structured Placeholder Rows (Carbon Pattern) -->
  <rect x="34" y="34" width="22" height="6" rx="3" fill="url(#sfBrandGrad)" />
  <rect x="34" y="48" width="36" height="4.5" rx="2.25" class="sf-skel-bold" />
  <rect x="34" y="58" width="48" height="3.5" rx="1.75" class="sf-skel-light" />
  <rect x="34" y="66" width="42" height="3.5" rx="1.75" class="sf-skel-light" />
  <rect x="34" y="74" width="32" height="3.5" rx="1.75" class="sf-skel-light" />

  <!-- Bottom Metric Indicators -->
  <rect x="34" y="86" width="16" height="3.5" rx="1.75" class="sf-skel-dim" />
  <rect x="54" y="86" width="12" height="3.5" rx="1.75" class="sf-skel-dim" />

  <!-- Glowing Action Emblem (+) Container -->
  <g filter="url(#sfEmblemShadow)">
    <!-- Radial Aura -->
    <circle cx="82" cy="96" r="20" fill="url(#sfEmblemAura)" class="sf-aura" />
    
    <!-- Outer Precision Ring -->
    <circle cx="82" cy="96" r="16" stroke="url(#sfBrandGrad)" stroke-width="1.2" fill="none" opacity="0.6" stroke-dasharray="2.5 1.5" />
    
    <!-- Emblem Solid Core -->
    <circle cx="82" cy="96" r="13.5" fill="url(#sfBrandGrad)" />
    
    <!-- Precise Architectural + Glyph -->
    <path d="M 82 89.5 V 102.5 M 75.5 96 H 88.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>