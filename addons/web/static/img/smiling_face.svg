<svg xmlns="http://www.w3.org/2000/svg" width="120" height="140" viewBox="0 0 120 140" fill="none">
  <defs>
    <!-- Brand Gradients (Insilos Orange Line Art / Horizon-Carbon) -->
    <linearGradient id="sfBrandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="55%" stop-color="#FF8000" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>

    <linearGradient id="sfFoldGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <radialGradient id="sfAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA500" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FF8000" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FF8000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sfGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sfEmblemAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA500" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#FF8000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </radialGradient>

    <filter id="sfCardShadow" x="14" y="16" width="94" height="108" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <filter id="sfEmblemShadow" x="58" y="74" width="48" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF6B00" flood-opacity="0.45" />
    </filter>

    <style><![CDATA[
      :root {
        --sf-card-bg: #FFFFFF;
        --sf-card-border: #DDE5ED;
        --sf-skel-primary: #D4DFEB;
        --sf-skel-secondary: #EDF2F7;
        --sf-skel-tertiary: #F4F7FA;
        --sf-fold-bg: #E2E8F0;
        --sf-fold-border: #CBD5E1;
        --sf-accent-dot: #FF8000;
      }
      .sf-card { fill: var(--sf-card-bg); stroke: var(--sf-card-border); stroke-width: 1.2; }
      .sf-fold { fill: var(--sf-fold-bg); stroke: var(--sf-fold-border); stroke-width: 1; }
      .sf-skel-bold { fill: var(--sf-skel-primary); }
      .sf-skel-light { fill: var(--sf-skel-secondary); }
      .sf-skel-dim { fill: var(--sf-skel-tertiary); }
      .sf-bg-glow { opacity: 0.85; }

      /* Particle and Interactive Keyframe Animations */
      @keyframes sfParticleFloat {
        0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.45; }
        50% { transform: translateY(-5px) scale(1.2); opacity: 1; }
      }
      @keyframes sfSparkleTwinkle {
        0%, 100% { transform: scale(0.65) rotate(0deg); opacity: 0.3; }
        50% { transform: scale(1.25) rotate(45deg); opacity: 1; }
      }
      @keyframes sfRingRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes sfAuraBreathe {
        0%, 100% { transform: scale(0.92); opacity: 0.6; }
        50% { transform: scale(1.18); opacity: 0.95; }
      }
      @keyframes sfCorePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      .sf-p1 { animation: sfParticleFloat 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .sf-p2 { animation: sfParticleFloat 4.0s ease-in-out infinite 1.0s; transform-box: fill-box; transform-origin: center; }
      .sf-p3 { animation: sfParticleFloat 3.6s ease-in-out infinite 1.8s; transform-box: fill-box; transform-origin: center; }
      .sf-p4 { animation: sfParticleFloat 4.2s ease-in-out infinite 0.5s; transform-box: fill-box; transform-origin: center; }

      .sf-s1 { animation: sfSparkleTwinkle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .sf-s2 { animation: sfSparkleTwinkle 3.2s ease-in-out infinite 1.2s; transform-box: fill-box; transform-origin: center; }
      .sf-s3 { animation: sfSparkleTwinkle 3.0s ease-in-out infinite 0.7s; transform-box: fill-box; transform-origin: center; }

      .sf-aura { animation: sfAuraBreathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .sf-ring { animation: sfRingRotate 12s linear infinite; transform-box: fill-box; transform-origin: center; }
      .sf-core { animation: sfCorePulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

      @media (prefers-color-scheme: dark) {
        :root {
          --sf-card-bg: #1A2230;
          --sf-card-border: #2D3A4F;
          --sf-skel-primary: #34445C;
          --sf-skel-secondary: #232D3F;
          --sf-skel-tertiary: #1E2636;
          --sf-fold-bg: #273347;
          --sf-fold-border: #3A4C68;
          --sf-accent-dot: #FF8000;
        }
        .sf-bg-glow { opacity: 1; }
      }
    ]]></style>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <ellipse cx="60" cy="65" rx="48" ry="52" fill="url(#sfAmbientGlow)" class="sf-bg-glow" />

  <!-- Ground Plane Contact Shadow -->
  <ellipse cx="60" cy="123" rx="38" ry="5" fill="url(#sfGroundShadow)" />

  <!-- Animated Particle Constellation (Sparkles & Floating Micro Dots) -->
  <circle cx="20" cy="38" r="1.6" fill="#FFA500" class="sf-p1" />
  <circle cx="102" cy="28" r="1.4" fill="#FF8000" class="sf-p2" />
  <circle cx="16" cy="72" r="1.2" fill="#FFA500" class="sf-p3" />
  <circle cx="106" cy="78" r="1.5" fill="#FF8000" class="sf-p4" />

  <!-- Star Sparkles (Twinkling) -->
  <path d="M 98 42 L 99.5 45 L 102.5 46.5 L 99.5 48 L 98 51 L 96.5 48 L 93.5 46.5 L 96.5 45 Z" fill="#FF8000" class="sf-s1" />
  <path d="M 22 22 L 23.2 24.5 L 25.7 25.7 L 23.2 26.9 L 22 29.4 L 20.8 26.9 L 18.3 25.7 L 20.8 24.5 Z" fill="#FFA500" class="sf-s2" />
  <path d="M 96 112 L 97 114 L 99 115 L 97 116 L 96 118 L 95 116 L 93 115 L 95 114 Z" fill="#FF8000" class="sf-s3" />

  <!-- Ceramic Document Card with Chamfer Fold (Filtered Shadow) -->
  <g filter="url(#sfCardShadow)">
    <path d="M 30 22 H 74 L 94 42 V 104 A 6 6 0 0 1 88 110 H 30 A 6 6 0 0 1 24 104 V 28 A 6 6 0 0 1 30 22 Z" class="sf-card" />
  </g>

  <!-- Folded Corner Flap -->
  <path d="M 74 22 V 36 A 6 6 0 0 0 80 42 H 94 Z" class="sf-fold" />
  <path d="M 74 42 L 74 36 L 80 42 Z" fill="#0B2E64" opacity="0.12" />

  <!-- Structured Placeholder Rows (Carbon Pattern) -->
  <rect x="34" y="34" width="22" height="6" rx="3" fill="url(#sfBrandGrad)" />
  <rect x="34" y="48" width="36" height="4.5" rx="2.25" class="sf-skel-bold" />
  <rect x="34" y="58" width="48" height="3.5" rx="1.75" class="sf-skel-light" />
  <rect x="34" y="66" width="42" height="3.5" rx="1.75" class="sf-skel-light" />
  <rect x="34" y="74" width="32" height="3.5" rx="1.75" class="sf-skel-light" />

  <!-- Bottom Metric Indicators -->
  <rect x="34" y="86" width="16" height="3.5" rx="1.75" class="sf-skel-dim" />
  <rect x="54" y="86" width="12" height="3.5" rx="1.75" class="sf-skel-dim" />

  <!-- Interactive Action Emblem (+) Container -->
  <g filter="url(#sfEmblemShadow)" class="sf-interactive-emblem">
    <!-- Breathing Radial Aura -->
    <circle cx="82" cy="96" r="22" fill="url(#sfEmblemAura)" class="sf-aura" />
    
    <!-- Rotating Dashed Orbit Ring -->
    <circle cx="82" cy="96" r="16.5" stroke="url(#sfBrandGrad)" stroke-width="1.3" fill="none" opacity="0.75" stroke-dasharray="2.5 1.5" class="sf-ring" />
    
    <!-- Pulsing Solid Core -->
    <g class="sf-core">
      <circle cx="82" cy="96" r="13.5" fill="url(#sfBrandGrad)" />
      <!-- Precise Architectural + Glyph -->
      <path d="M 82 89.5 V 102.5 M 75.5 96 H 88.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>