version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: insilos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: odoo20_dev
      POSTGRES_USER: insilos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1NN0R1@2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - insilos_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insilos -d odoo20_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insilos_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "28069:28069"
      - "28072:28072"
    environment:
      - HOST=db
      - PORT=5432
      - USER=insilos
      - PASSWORD=1NN0R1@2026
    volumes:
      - insilos_filestore:/opt/insilos/.local/share/Insilos/filestore
      - ./insilos.conf:/opt/insilos/insilos.conf:ro

volumes:
  insilos_pgdata:
  insilos_filestore:
